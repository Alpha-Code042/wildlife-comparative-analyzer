<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Wildlife Comparative Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header>

        <h1>Wildlife Comparative Analyzer</h1>

        <p>
            Create your research account
        </p>

    </header>


    <main>

        <section class="welcome">

            <h2>Create Account</h2>

            <p>
                Register to analyse wildlife images and videos.
            </p>


            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>


            <p style="margin-top: 20px;">

                Already have an account?

                <a href="{{ url_for('main.login') }}">
                    Login
                </a>

            </p>

        </section>

    </main>

</body>

</html>
