<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Wildlife Comparative Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">
                <div class="brand-mark">W</div>
                <h1 style="margin-top:14px;">Create your account</h1>
                <p class="auth-intro">Set up your wildlife analysis workspace.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-list">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('main.register') }}" class="form-stack">
                <div class="form-field">
                    <label class="field-label" for="username">Username</label>
                    <input
                        id="username"
                        type="text"
                        name="username"
                        autocomplete="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>

                <div class="form-field">
                    <label class="field-label" for="email">Email address</label>
                    <input
                        id="email"
                        type="email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-field">
                    <label class="field-label" for="password">Password</label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <button type="submit" style="width:100%;margin-top:5px;">
                    Create Account
                </button>
            </form>

            <p class="auth-footer">
                Already registered?
                <a href="{{ url_for('main.login') }}">Log in</a>
            </p>
        </section>
    </main>
</body>
</html>
