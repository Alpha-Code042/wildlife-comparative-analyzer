<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Wildlife Comparative Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">
                <div class="brand-mark">W</div>
                <h1 style="margin-top:14px;">Welcome back</h1>
                <p class="auth-intro">Log in to your wildlife analysis workspace.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-list">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('main.login') }}" class="form-stack">
                <div class="form-field">
                    <label class="field-label" for="email">Email address</label>
                    <input
                        id="email"
                        type="email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-field">
                    <label class="field-label" for="password">Password</label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" style="width:100%;margin-top:5px;">Log In</button>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="{{ url_for('main.register') }}">Create an account</a>
            </p>

            <p class="footer-note">
                <a href="{{ url_for('main.home') }}">Back to home</a>
            </p>
        </section>
    </main>
</body>
</html>
